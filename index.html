<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent to Confident — 66-Day Cohort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15130F;
    --bg-raised:#1D1A14;
    --bg-raised-2:#242019;
    --accent:#F2793B;
    --accent-2:#F7B267;
    --text:#F2EDE4;
    --text-dim:#B8AFA0;
    --text-dimmer:#7A7263;
    --border:#33301F55;
    --border-soft:#2A2620;
    --success:#8FBF7F;
    --locked:#4A473E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:600;
    line-height:1.2;
    margin:0 0 .5em 0;
  }
  p{line-height:1.6;margin:0 0 1em 0;}
  a{color:var(--accent-2);}
  button{font-family:inherit;}

  /* ---------- App shell ---------- */
  #app{
    max-width:820px;
    margin:0 auto;
    padding-bottom:100px;
  }
  header.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding:20px 20px 8px 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .brand h1{
    font-size:1.15rem;
    color:var(--accent);
    margin:0;
  }
  .brand .tagline{
    font-size:.72rem;
    color:var(--text-dimmer);
    display:none;
  }
  main{padding:0 20px;}

  /* ---------- Nav ---------- */
  nav.tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding:14px 20px 10px 20px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:none;
    border:none;
    color:var(--text-dimmer);
    font-size:.82rem;
    font-weight:600;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  nav.tabs button.active{
    background:var(--accent);
    color:#1a1208;
  }
  nav.tabs button:not(.active):hover{
    color:var(--text);
    background:var(--bg-raised);
  }

  /* ---------- Cards ---------- */
  .card{
    background:var(--bg-raised);
    border:1px solid var(--border-soft);
    border-radius:16px;
    padding:24px;
    margin-bottom:16px;
  }
  .card.soft{
    background:linear-gradient(135deg, #241d15, #1c1912);
  }

  .day-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--bg-raised-2);
    color:var(--accent-2);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .district-name{
    color:var(--text-dimmer);
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
  }

  .home-title{
    font-size:1.6rem;
    color:var(--text);
  }

  section.block{margin-top:22px;}
  section.block h3{
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent-2);
    margin-bottom:8px;
  }
  section.block .body-text{
    color:var(--text);
    font-size:.98rem;
  }

  .further-list{
    list-style:none;
    margin:0;padding:0;
  }
  .further-list li{
    padding:10px 14px;
    background:var(--bg-raised-2);
    border-radius:10px;
    margin-bottom:8px;
    font-size:.9rem;
    color:var(--text-dim);
  }

  details.stretch{
    background:var(--bg-raised-2);
    border-radius:10px;
    padding:2px 14px;
  }
  details.stretch summary{
    cursor:pointer;
    padding:12px 0;
    font-weight:600;
    color:var(--accent-2);
    font-size:.9rem;
    list-style:none;
  }
  details.stretch summary::-webkit-details-marker{display:none;}
  details.stretch summary::before{
    content:'+ ';
  }
  details.stretch[open] summary::before{
    content:'– ';
  }
  details.stretch p{padding-bottom:14px;color:var(--text-dim);}

  .teaser-box{
    background:linear-gradient(135deg, #2b2013, #1e1a12);
    border:1px dashed #55402544;
    border-radius:10px;
    padding:14px 16px;
    font-size:.88rem;
    color:var(--text-dim);
    font-style:italic;
  }
  .teaser-locked{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-dimmer);
    font-size:.85rem;
    padding:12px 0;
  }

  /* ---------- Reflection ---------- */
  textarea{
    width:100%;
    min-height:140px;
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:10px;
    color:var(--text);
    font-family:inherit;
    font-size:.95rem;
    padding:14px;
    resize:vertical;
    line-height:1.5;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .wordcount{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:.78rem;
    color:var(--text-dimmer);
  }
  .wordcount.ok{color:var(--success);}
  .submit-btn{
    margin-top:14px;
    width:100%;
    background:var(--accent);
    color:#1a1208;
    border:none;
    padding:14px;
    border-radius:10px;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .submit-btn:hover:not(:disabled){background:var(--accent-2);}
  .submit-btn:active:not(:disabled){transform:scale(.98);}
  .submit-btn:disabled{
    background:var(--locked);
    color:var(--text-dimmer);
    cursor:not-allowed;
  }
  .submit-btn.ack{background:var(--accent);}

  .done-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background:#8FBF7F1a;
    border:1px solid #8FBF7F44;
    color:var(--success);
    padding:12px 16px;
    border-radius:10px;
    font-weight:600;
    font-size:.9rem;
  }

  /* ---------- Progress grid ---------- */
  .progress-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .progress-header .count{
    color:var(--accent);
    font-weight:700;
  }
  .progress-bar-outer{
    height:8px;
    background:var(--bg-raised-2);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar-inner{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:6px;
    transition:width .3s ease;
  }
  .district-group{margin-bottom:22px;}
  .district-group-title{
    font-size:.8rem;
    color:var(--text-dim);
    font-weight:600;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .district-group-title .badge{
    font-size:.65rem;
    background:var(--accent);
    color:#1a1208;
    padding:2px 8px;
    border-radius:10px;
    font-weight:700;
    text-transform:uppercase;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
  }
  .cell{
    aspect-ratio:1;
    border-radius:6px;
    background:var(--bg-raised-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.68rem;
    font-weight:700;
    color:var(--text-dimmer);
    cursor:pointer;
    border:2px solid transparent;
    position:relative;
    transition:transform .1s ease;
  }
  .cell:hover{transform:scale(1.08);}
  .cell.done{
    background:var(--accent);
    color:#1a1208;
  }
  .cell.locked{
    color:var(--locked);
    cursor:default;
  }
  .cell.today{
    border-color:var(--accent-2);
    box-shadow:0 0 0 2px #F7B26733;
  }
  .cell.locked:hover{transform:none;}
  .cell .lock-ic{font-size:.6rem;}

  .challenge-banner{
    background:linear-gradient(135deg, var(--accent), #d9622a);
    color:#1a1208;
    border-radius:14px;
    padding:16px 20px;
    margin-bottom:20px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
  }

  /* ---------- Static sections ---------- */
  .placeholder-item{
    padding:14px 0;
    border-bottom:1px solid var(--border-soft);
  }
  .placeholder-item:last-child{border-bottom:none;}
  .placeholder-item .meta{
    font-size:.75rem;
    color:var(--text-dimmer);
    margin-bottom:4px;
  }
  .faq-q{
    font-weight:600;
    color:var(--accent-2);
    margin-bottom:4px;
    font-size:.92rem;
  }
  .faq-a{color:var(--text-dim);font-size:.9rem;margin-bottom:0;}

  /* ---------- Celebration ---------- */
  #confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:200;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-10px;
    border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.3; }
  }

  .celebrate-toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--accent);
    color:#1a1208;
    padding:14px 22px;
    border-radius:30px;
    font-weight:700;
    font-size:.9rem;
    box-shadow:0 8px 24px #00000066;
    z-index:201;
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
  }
  .celebrate-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---------- Bottom nav (mobile) ---------- */
  nav.bottombar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--bg-raised);
    border-top:1px solid var(--border-soft);
    display:flex;
    justify-content:space-around;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:100;
  }
  nav.bottombar button{
    background:none;
    border:none;
    color:var(--text-dimmer);
    font-size:.68rem;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:4px 6px;
    cursor:pointer;
  }
  nav.bottombar button .ic{font-size:1.05rem;}
  nav.bottombar button.active{color:var(--accent);}

  @media (min-width:640px){
    .brand .tagline{display:block;}
    nav.bottombar{display:none;}
    #app{padding-bottom:40px;}
  }
  @media (max-width:639px){
    nav.tabs{display:none;}
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Silent to Confident</h1>
      <span class="tagline" id="tagline-text"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view"></main>
</div>

<nav class="bottombar" id="bottombar"></nav>

<div id="confetti-layer"></div>
<div class="celebrate-toast" id="toast">✨ Reflection saved — Day unlocked</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "s2c_progress_v1";
  const DISTRICTS = [
    {n:1, range:[1,7], name:"Why I'm Silent"},
    {n:2, range:[8,14], name:"The Language of Speaking Up"},
    {n:3, range:[15,21], name:"Entering the Room"},
    {n:4, range:[22,28], name:"Holding Your Ground"},
    {n:5, range:[29,35], name:"Making Them Want to Listen"},
    {n:6, range:[36,42], name:"Reading the Room in Real Time"},
    {n:7, range:[43,49], name:"The Voice People Know"},
    {n:8, range:[50,66], name:"Challenge Week"}
  ];

  const TABS = [
    {id:"home", label:"Home", icon:"🏠"},
    {id:"progress", label:"Progress", icon:"📊"},
    {id:"community", label:"Community", icon:"💬"},
    {id:"resources", label:"Resources", icon:"📚"},
    {id:"recordings", label:"Recordings", icon:"🎙️"},
    {id:"questions", label:"Questions", icon:"❓"}
  ];

  let DATA = null;
  let state = { activeTab: "home", viewingDay: null };

  /* ---------- Progress persistence ---------- */
  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { completedDays: [], reflections: {} };
  }
  function saveProgress(p){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  }
  let progress = loadProgress();

  function isDayUnlocked(dayNum){
    if(dayNum === 1) return true;
    return progress.completedDays.includes(dayNum - 1);
  }
  function isDayComplete(dayNum){
    return progress.completedDays.includes(dayNum);
  }
  function currentDay(){
    // First day not yet completed, capped at totalDays
    for(let i = 1; i <= DATA.totalDays; i++){
      if(!isDayComplete(i)) return i;
    }
    return DATA.totalDays;
  }
  function districtFor(dayNum){
    return DISTRICTS.find(d => dayNum >= d.range[0] && dayNum <= d.range[1]);
  }
  function markComplete(dayNum, reflectionText){
    if(!progress.completedDays.includes(dayNum)){
      progress.completedDays.push(dayNum);
    }
    if(reflectionText !== undefined){
      progress.reflections[dayNum] = reflectionText;
    }
    saveProgress(progress);
  }

  /* ---------- Fetch data ---------- */
  fetch("data.json")
    .then(r => r.json())
    .then(json => {
      DATA = json;
      document.getElementById("tagline-text").textContent = DATA.tagline;
      init();
    })
    .catch(err => {
      document.getElementById("view").innerHTML =
        "<div class='card'><p>Could not load data.json — make sure it's in the same directory as index.html.</p></div>";
      console.error(err);
    });

  function init(){
    renderTabs();
    renderBottomBar();
    render();
  }

  /* ---------- Nav rendering ---------- */
  function renderTabs(){
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = "";
    TABS.forEach(t => {
      const btn = document.createElement("button");
      btn.textContent = t.label;
      btn.className = state.activeTab === t.id ? "active" : "";
      btn.onclick = () => { state.activeTab = t.id; state.viewingDay = null; render(); };
      tabsEl.appendChild(btn);
    });
  }
  function renderBottomBar(){
    const el = document.getElementById("bottombar");
    el.innerHTML = "";
    TABS.forEach(t => {
      const btn = document.createElement("button");
      btn.className = state.activeTab === t.id ? "active" : "";
      btn.innerHTML = `<span class="ic">${t.icon}</span><span>${t.label}</span>`;
      btn.onclick = () => { state.activeTab = t.id; state.viewingDay = null; render(); };
      el.appendChild(btn);
    });
  }

  function render(){
    renderTabs();
    renderBottomBar();
    const view = document.getElementById("view");
    view.innerHTML = "";
    switch(state.activeTab){
      case "home": view.appendChild(renderHome()); break;
      case "progress": view.appendChild(renderProgress()); break;
      case "community": view.appendChild(renderCommunity()); break;
      case "resources": view.appendChild(renderResources()); break;
      case "recordings": view.appendChild(renderRecordings()); break;
      case "questions": view.appendChild(renderQuestions()); break;
    }
    window.scrollTo({top:0, behavior:"instant"});
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    const wrap = document.createElement("div");
    const dayNum = state.viewingDay || currentDay();
    const day = DATA.days.find(d => d.day === dayNum);
    const dist = districtFor(dayNum);

    if(!day){
      wrap.innerHTML = "<div class='card'><p>You've completed all 66 days. 🎉</p></div>";
      return wrap;
    }

    if(dayNum >= 53 && dist.n === 8){
      const banner = document.createElement("div");
      banner.className = "challenge-banner";
      banner.innerHTML = `<span>🔥</span><span>Challenge Week — Day ${dayNum} of 66. This is the final stretch.</span>`;
      wrap.appendChild(banner);
    }

    const card = document.createElement("div");
    card.className = day.type === "sunday" ? "card soft" : "card";

    const pill = document.createElement("div");
    pill.className = "day-pill";
    pill.innerHTML = `Day ${day.day} of ${DATA.totalDays} <span class="district-name">· District ${dist.n} — ${dist.name}</span>`;
    card.appendChild(pill);

    const h = document.createElement("h2");
    h.className = "home-title";
    h.textContent = day.title;
    card.appendChild(h);

    if(day.type === "learning" || day.type === "buffer"){
      card.appendChild(renderLearningBody(day));
    } else if(day.type === "sunday"){
      card.appendChild(renderSundayBody(day));
    } else if(day.type === "light"){
      card.appendChild(renderLightBody(day));
    }

    wrap.appendChild(card);

    // Day picker link back to "today" if browsing history
    if(state.viewingDay && state.viewingDay !== currentDay()){
      const backBtn = document.createElement("button");
      backBtn.className = "submit-btn";
      backBtn.style.background = "var(--bg-raised-2)";
      backBtn.style.color = "var(--text-dim)";
      backBtn.textContent = "← Back to today";
      backBtn.onclick = () => { state.viewingDay = null; render(); };
      wrap.appendChild(backBtn);
    }

    return wrap;
  }

  function makeBlock(label, text){
    const s = document.createElement("section");
    s.className = "block";
    s.innerHTML = `<h3>${label}</h3><div class="body-text"></div>`;
    s.querySelector(".body-text").textContent = text;
    return s;
  }

  function renderLearningBody(day){
    const frag = document.createDocumentFragment();
    frag.appendChild(makeBlock("The Idea", day.idea));
    frag.appendChild(makeBlock("Why It Matters", day.why));
    frag.appendChild(makeBlock("Today's Build", day.task));
    frag.appendChild(renderReflectionBlock(day));

    if(day.further && day.further.length){
      const s = document.createElement("section");
      s.className = "block";
      s.innerHTML = "<h3>Further Reading</h3>";
      const ul = document.createElement("ul");
      ul.className = "further-list";
      day.further.forEach(f => {
        const li = document.createElement("li");
        li.textContent = f;
        ul.appendChild(li);
      });
      s.appendChild(ul);
      frag.appendChild(s);
    }

    if(day.stretch){
      const s = document.createElement("section");
      s.className = "block";
      s.innerHTML = "<h3>Stretch (optional)</h3>";
      const det = document.createElement("details");
      det.className = "stretch";
      det.innerHTML = `<summary>Push a little further</summary><p></p>`;
      det.querySelector("p").textContent = day.stretch;
      s.appendChild(det);
      frag.appendChild(s);
    }

    if(day.teaser){
      frag.appendChild(renderTeaserBlock(day));
    }

    return frag;
  }

  function renderSundayBody(day){
    const frag = document.createDocumentFragment();

    const s1 = document.createElement("section");
    s1.className = "block";
    s1.innerHTML = "<h3>This Week's Recap</h3>";
    const ol = document.createElement("ol");
    ol.style.paddingLeft = "20px";
    ol.style.color = "var(--text)";
    (day.recap || []).forEach(q => {
      const li = document.createElement("li");
      li.style.marginBottom = "10px";
      li.textContent = q;
      ol.appendChild(li);
    });
    s1.appendChild(ol);
    frag.appendChild(s1);

    if(day.community){
      frag.appendChild(makeBlock("Share With the Community", day.community));
    }
    if(day.rest){
      const s = document.createElement("section");
      s.className = "block";
      const card = document.createElement("div");
      card.className = "card soft";
      card.style.margin = "0";
      card.style.padding = "18px";
      card.textContent = day.rest;
      s.appendChild(card);
      frag.appendChild(s);
    }

    frag.appendChild(renderSundayUnlockBlock(day));
    return frag;
  }

  function renderLightBody(day){
    const frag = document.createDocumentFragment();
    frag.appendChild(makeBlock("Today", day.body));
    if(day.community){
      frag.appendChild(makeBlock("Community", day.community));
    }
    frag.appendChild(renderLightReflectionBlock(day));
    if(day.teaser){
      frag.appendChild(renderTeaserBlock(day));
    }
    return frag;
  }

  /* ---------- Reflection widgets ---------- */
  function countWords(text){
    const trimmed = text.trim();
    if(!trimmed) return 0;
    return trimmed.split(/\s+/).length;
  }

  function renderReflectionBlock(day){
    const s = document.createElement("section");
    s.className = "block";
    s.innerHTML = "<h3>Reflection</h3>";

    const complete = isDayComplete(day.day);

    if(complete){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      banner.innerHTML = `<span>✓</span><span>Reflection submitted. Day ${day.day + 1} is unlocked.</span>`;
      s.appendChild(banner);
      return s;
    }

    const promptP = document.createElement("p");
    promptP.className = "body-text";
    promptP.style.color = "var(--text-dim)";
    promptP.style.fontSize = ".85rem";
    promptP.textContent = day.reflection;
    s.appendChild(promptP);

    const ta = document.createElement("textarea");
    ta.placeholder = "Write your reflection here...";
    ta.value = progress.reflections[day.day] || "";
    s.appendChild(ta);

    const wc = document.createElement("div");
    wc.className = "wordcount";
    const wcSpan = document.createElement("span");
    const minSpan = document.createElement("span");
    minSpan.textContent = "Minimum 100 words";
    wc.appendChild(wcSpan);
    wc.appendChild(minSpan);
    s.appendChild(wc);

    const btn = document.createElement("button");
    btn.className = "submit-btn";
    btn.textContent = "Submit Reflection";
    s.appendChild(btn);

    function updateState(){
      const words = countWords(ta.value);
      wcSpan.textContent = `${words} / 100 words`;
      const ok = words >= 100;
      wc.className = "wordcount" + (ok ? " ok" : "");
      btn.disabled = !ok;
    }
    ta.addEventListener("input", updateState);
    updateState();

    btn.onclick = () => {
      if(countWords(ta.value) < 100) return;
      markComplete(day.day, ta.value);
      celebrate();
      render();
    };

    return s;
  }

  function renderLightReflectionBlock(day){
    const s = document.createElement("section");
    s.className = "block";
    s.innerHTML = "<h3>Reflection</h3>";

    const complete = isDayComplete(day.day);

    if(complete){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      const nextTxt = day.day < DATA.totalDays ? `Day ${day.day + 1} is unlocked.` : "You've completed the cohort.";
      banner.innerHTML = `<span>✓</span><span>Acknowledged. ${nextTxt}</span>`;
      s.appendChild(banner);
      return s;
    }

    const promptP = document.createElement("p");
    promptP.className = "body-text";
    promptP.style.color = "var(--text-dim)";
    promptP.style.fontSize = ".85rem";
    promptP.textContent = day.reflection;
    s.appendChild(promptP);

    const ta = document.createElement("textarea");
    ta.placeholder = "Write your reflection here (optional)...";
    ta.style.minHeight = "100px";
    ta.value = progress.reflections[day.day] || "";
    s.appendChild(ta);

    const btn = document.createElement("button");
    btn.className = "submit-btn ack";
    btn.textContent = "Continue";
    s.appendChild(btn);

    btn.onclick = () => {
      markComplete(day.day, ta.value);
      celebrate();
      render();
    };

    return s;
  }

  function renderSundayUnlockBlock(day){
    const s = document.createElement("section");
    s.className = "block";
    const complete = isDayComplete(day.day);

    if(complete){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      const nextTxt = day.day < DATA.totalDays ? `Day ${day.day + 1} is unlocked.` : "You've completed the cohort.";
      banner.innerHTML = `<span>✓</span><span>${nextTxt}</span>`;
      s.appendChild(banner);
      return s;
    }

    const btn = document.createElement("button");
    btn.className = "submit-btn ack";
    btn.textContent = "I've reflected — Unlock next district";
    s.appendChild(btn);
    btn.onclick = () => {
      markComplete(day.day);
      celebrate();
      render();
    };
    return s;
  }

  function renderTeaserBlock(day){
    const s = document.createElement("section");
    s.className = "block";
    s.innerHTML = "<h3>Tomorrow</h3>";
    const complete = isDayComplete(day.day);
    if(complete){
      const box = document.createElement("div");
      box.className = "teaser-box";
      box.textContent = day.teaser;
      s.appendChild(box);
    }else{
      const locked = document.createElement("div");
      locked.className = "teaser-locked";
      locked.innerHTML = `<span>🔒</span><span>Submit today's reflection to reveal tomorrow's teaser.</span>`;
      s.appendChild(locked);
    }
    return s;
  }

  /* ---------- Celebration micro-animation ---------- */
  function celebrate(){
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);

    const layer = document.getElementById("confetti-layer");
    const colors = ["#F2793B", "#F7B267", "#F2EDE4"];
    for(let i = 0; i < 26; i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      const size = 6 + Math.random() * 6;
      p.style.width = size + "px";
      p.style.height = (size * 0.4) + "px";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (1.6 + Math.random() * 1.2) + "s";
      p.style.animationDelay = (Math.random() * 0.3) + "s";
      layer.appendChild(p);
      setTimeout(() => p.remove(), 3200);
    }
  }

  /* ---------- PROGRESS ---------- */
  function renderProgress(){
    const wrap = document.createElement("div");

    const completedCount = progress.completedDays.length;
    const header = document.createElement("div");
    header.className = "progress-header";
    header.innerHTML = `<h2 style="margin:0;">Your Progress</h2><span class="count">${completedCount} / ${DATA.totalDays}</span>`;
    wrap.appendChild(header);

    const barOuter = document.createElement("div");
    barOuter.className = "progress-bar-outer";
    const barInner = document.createElement("div");
    barInner.className = "progress-bar-inner";
    barInner.style.width = `${(completedCount / DATA.totalDays) * 100}%`;
    barOuter.appendChild(barInner);
    wrap.appendChild(barOuter);

    const today = currentDay();

    DISTRICTS.forEach(dist => {
      const group = document.createElement("div");
      group.className = "district-group";

      const title = document.createElement("div");
      title.className = "district-group-title";
      title.innerHTML = `<span class="badge">D${dist.n}</span><span>${dist.name}</span>`;
      group.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";

      for(let d = dist.range[0]; d <= dist.range[1]; d++){
        const cell = document.createElement("div");
        const done = isDayComplete(d);
        const unlocked = isDayUnlocked(d);
        const isToday = d === today;

        let cls = "cell";
        if(done) cls += " done";
        else if(!unlocked) cls += " locked";
        if(isToday) cls += " today";
        cell.className = cls;

        if(!unlocked){
          cell.innerHTML = `<span class="lock-ic">🔒</span>`;
        }else{
          cell.textContent = d;
        }

        if(unlocked){
          cell.onclick = () => {
            state.viewingDay = d;
            state.activeTab = "home";
            render();
          };
        }
        grid.appendChild(cell);
      }
      group.appendChild(grid);
      wrap.appendChild(group);
    });

    return wrap;
  }

  /* ---------- COMMUNITY ---------- */
  function renderCommunity(){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <h2>Community</h2>
      <p style="color:var(--text-dim);">A space to share your reps with people doing the same work.</p>
      <div class="card">
        <div class="placeholder-item">
          <div class="meta">Announcement</div>
          <p>Welcome to Silent to Confident. Post your Day 6 "one sentence" moment below when you get there — the group loves hearing the small, real ones.</p>
        </div>
        <div class="placeholder-item">
          <div class="meta">Announcement</div>
          <p>Weekly community thread opens every Sunday alongside "Connecting the Dots." Drop your recap there.</p>
        </div>
        <div class="placeholder-item">
          <div class="meta">Announcement</div>
          <p>Challenge Week (Days 53–66) has its own dedicated thread — tag your posts with your Challenge moment for feedback.</p>
        </div>
      </div>
    `;
    return wrap;
  }

  /* ---------- RESOURCES ---------- */
  function renderResources(){
    const wrap = document.createElement("div");
    const h = document.createElement("h2");
    h.textContent = "Resources";
    wrap.appendChild(h);
    const p = document.createElement("p");
    p.style.color = "var(--text-dim)";
    p.textContent = "Further reading and tools pulled from each day, organized by district.";
    wrap.appendChild(p);

    DISTRICTS.forEach(dist => {
      const daysInDist = DATA.days.filter(d => d.day >= dist.range[0] && d.day <= dist.range[1] && d.further && d.further.length);
      if(!daysInDist.length) return;

      const card = document.createElement("div");
      card.className = "card";
      const title = document.createElement("div");
      title.className = "district-group-title";
      title.innerHTML = `<span class="badge">D${dist.n}</span><span>${dist.name}</span>`;
      card.appendChild(title);

      daysInDist.forEach(d => {
        d.further.forEach(f => {
          if(/^\[Tool\] None/i.test(f)) return;
          const item = document.createElement("div");
          item.className = "placeholder-item";
          item.innerHTML = `<div class="meta">Day ${d.day} — ${d.title}</div>`;
          const pEl = document.createElement("p");
          pEl.className = "faq-a";
          pEl.textContent = f;
          item.appendChild(pEl);
          card.appendChild(item);
        });
      });
      wrap.appendChild(card);
    });

    return wrap;
  }

  /* ---------- RECORDINGS ---------- */
  function renderRecordings(){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <h2>Recordings</h2>
      <p style="color:var(--text-dim);">Live session recordings will appear here after each cohort call.</p>
      <div class="card">
        <div class="placeholder-item">
          <div class="meta">District 1 Kickoff</div>
          <p>Recording will be posted after the live session.</p>
        </div>
        <div class="placeholder-item">
          <div class="meta">Mid-Cohort Q&A (Week 5)</div>
          <p>Recording will be posted after the live session.</p>
        </div>
        <div class="placeholder-item">
          <div class="meta">Challenge Week Kickoff</div>
          <p>Recording will be posted after the live session.</p>
        </div>
      </div>
    `;
    return wrap;
  }

  /* ---------- QUESTIONS ---------- */
  function renderQuestions(){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <h2>Questions</h2>
      <p style="color:var(--text-dim);">Answers to what people usually ask in the first two weeks.</p>
      <div class="card">
        <div class="placeholder-item">
          <div class="faq-q">What if I miss a day?</div>
          <p class="faq-a">Your progress just waits for you — there's no penalty. Come back and submit that day's reflection whenever you're ready; the next day unlocks right after.</p>
        </div>
        <div class="placeholder-item">
          <div class="faq-q">Do Sundays need a 100-word reflection too?</div>
          <p class="faq-a">No. Sundays are lighter "Connecting the Dots" days — just work through the recap questions and tap through to unlock Monday.</p>
        </div>
        <div class="placeholder-item">
          <div class="faq-q">What is Challenge Week?</div>
          <p class="faq-a">Days 50–66. A short reset (Days 50–51), a recap Sunday (Day 52), then a 14-day arc where you plan, execute, and reflect on one real moment of speaking up.</p>
        </div>
        <div class="placeholder-item">
          <div class="faq-q">Is my data private?</div>
          <p class="faq-a">Yes — reflections are stored locally in your browser only. Nothing is uploaded unless you choose to share it in Community.</p>
        </div>
      </div>
    `;
    return wrap;
  }

})();
</script>
</body>
</html>
