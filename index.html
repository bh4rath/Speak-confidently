<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent to Confident — 66-Day Cohort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-w: 248px;
    --nav-h: 60px;
    --bottom-h: 64px;
  }

  /* ============ THEME TOKENS ============ */
  :root[data-theme="dark"]{
    --bg:#15130F;
    --bg-raised:#1D1A14;
    --bg-raised-2:#242019;
    --bg-sidebar:#191610;
    --accent:#F2793B;       /* solid fills: buttons, progress, badges */
    --accent-text:#F2793B;  /* text/icon/heading color on page bg */
    --accent-2:#F7B267;     /* secondary highlight / hover text */
    --ink:#1F1208;          /* dark text drawn on top of solid accent fills */
    --text:#F2EDE4;
    --text-dim:#B8AFA0;
    --text-dimmer:#8A8172;
    --border:#33301F88;
    --border-soft:#2A2620;
    --success:#8FBF7F;
    --locked:#4A473E;
    --cream-bg:#F5EDDA;
    --cream-text:#3D3425;
    --overlay:rgba(10,9,6,0.65);
  }
  :root[data-theme="light"]{
    --bg:#FBF6EE;
    --bg-raised:#FFFFFF;
    --bg-raised-2:#F3E9D8;
    --bg-sidebar:#FFFFFF;
    --accent:#E2672B;
    --accent-text:#A6461B;
    --accent-2:#B5581F;
    --ink:#241206;
    --text:#2B2013;
    --text-dim:#6B5D47;
    --text-dimmer:#8A7A61;
    --border:#00000018;
    --border-soft:#00000012;
    --success:#1E8A4C;
    --locked:#C9BEA9;
    --cream-bg:#FFFDF6;
    --cream-text:#3D3425;
    --overlay:rgba(40,30,15,0.45);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:600;
    line-height:1.2;
    margin:0 0 .5em 0;
    color:var(--text);
  }
  p{line-height:1.7;margin:0 0 1em 0;}
  a{color:var(--accent-2);}
  button{font-family:inherit;}
  svg{display:block;}

  :focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:4px;}
  :focus:not(:focus-visible){outline:none;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ============ NAVBAR ============ */
  #navbar{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--nav-h);
    background:var(--bg-sidebar);
    border-bottom:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    z-index:300;
  }
  .nb-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .nb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  #hamburger{
    display:none;
    background:none;border:none;color:var(--text);
    width:44px;height:44px;border-radius:8px;
    align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  #hamburger:hover{background:var(--bg-raised-2);}
  .nb-brand{
    display:flex;align-items:center;gap:8px;
    font-family:'Fraunces',serif;font-weight:600;
    color:var(--accent-text);
    font-size:1rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nb-brand .mark{
    width:26px;height:26px;border-radius:8px;
    background:var(--accent);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:.85rem;
    flex-shrink:0;
  }
  .icon-btn{
    width:44px;height:44px;border-radius:9px;
    background:var(--bg-raised-2);
    border:1px solid var(--border-soft);
    color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
    flex-shrink:0;
  }
  .icon-btn:hover{transform:scale(1.06);}
  .icon-btn:active{transform:scale(.95);}
  .status-chip{
    font-size:.72rem;
    font-weight:700;
    color:var(--accent-text);
    background:var(--bg-raised-2);
    border:1px solid var(--border-soft);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
  }
  @media (max-width:520px){ .status-chip{display:none;} }

  /* ============ SIDEBAR ============ */
  #sidebar{
    position:fixed;
    top:var(--nav-h);left:0;
    width:var(--sidebar-w);
    height:calc(100vh - var(--nav-h));
    background:var(--bg-sidebar);
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;
    z-index:250;
    transition:transform .22s ease;
    overflow-y:auto;
  }
  .sb-top{padding:20px 18px 14px;}
  .sb-title{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:600;color:var(--text);}
  .sb-sub{font-size:.78rem;color:var(--text-dimmer);margin-top:2px;line-height:1.4;}

  .sb-nav{flex:1;padding:6px 10px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    font-size:.9rem;font-weight:600;
    color:var(--text-dim);
    padding:11px 12px;
    border-radius:9px;
    cursor:pointer;
    border-left:3px solid transparent;
    margin-bottom:2px;
    transition:background .15s ease, color .15s ease;
    user-select:none;
  }
  .nav-item:hover{background:var(--bg-raised-2);color:var(--text);}
  .nav-item.active{
    background:var(--bg-raised-2);
    color:var(--accent-text);
    border-left-color:var(--accent);
  }
  .nav-icon{width:19px;height:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .nav-label{flex:1;}
  .nav-badge{
    background:var(--accent);
    color:var(--ink);
    font-size:.66rem;
    font-weight:800;
    padding:1px 7px;
    border-radius:20px;
    line-height:16px;
  }

  .sb-progress{
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border-soft);
  }
  .sb-progress-label{
    font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:8px;
    display:flex;justify-content:space-between;
  }
  .sb-progress-label .pct{color:var(--accent-text);}
  .sb-progress-bar{
    height:6px;background:var(--bg-raised-2);border-radius:6px;overflow:hidden;
  }
  .sb-progress-fill{
    height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:6px;transition:width .4s ease;
  }

  #overlay{
    display:none;
    position:fixed;inset:0;
    background:var(--overlay);
    z-index:240;
  }
  #overlay.show{display:block;}

  /* ============ MAIN ============ */
  #main{
    margin-left:var(--sidebar-w);
    margin-top:var(--nav-h);
    padding:28px 32px 60px;
    max-width:calc(var(--sidebar-w) + 760px);
    min-height:calc(100vh - var(--nav-h));
  }
  .content-col{max-width:720px;}

  /* ============ DAY PILL NAV ============ */
  .day-nav{
    display:flex;align-items:center;gap:8px;
    overflow-x:auto;scrollbar-width:none;
    padding:2px 2px 16px;
    max-width:720px;
  }
  .day-nav::-webkit-scrollbar{display:none;}
  .day-arrow{
    width:36px;height:36px;border-radius:9px;flex-shrink:0;
    background:var(--bg-raised);
    border:1.5px solid var(--border-soft);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease;
  }
  .day-arrow:hover:not(:disabled){background:var(--bg-raised-2);}
  .day-arrow:disabled{opacity:.35;cursor:default;}
  .pill{
    min-width:58px;height:50px;
    border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--bg-raised);
    border:1.5px solid var(--border-soft);
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s ease, border-color .15s ease;
  }
  .pill:hover:not(.pill-locked){transform:translateY(-1px);}
  .pill-label{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dimmer);}
  .pill-num{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;color:var(--text);}
  .pill-current{background:var(--accent);border-color:var(--accent);}
  .pill-current .pill-label,.pill-current .pill-num{color:var(--ink);}
  .pill-done{border-color:var(--accent);}
  .pill-done .pill-label,.pill-done .pill-num{color:var(--accent-text);}
  .pill-today{border-color:var(--accent-2);}
  .pill-today .pill-label,.pill-today .pill-num{color:var(--accent-2);}
  .pill-locked{opacity:.4;cursor:default;}
  .pill-locked:hover{transform:none;}

  /* ============ CARDS / SECTIONS ============ */
  .card{
    background:var(--bg-raised);
    border:1px solid var(--border-soft);
    border-radius:16px;
    padding:26px;
    margin-bottom:16px;
  }
  .card.soft{background:linear-gradient(135deg, var(--bg-raised-2), var(--bg-raised));}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:.7rem;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent-text);
    margin-bottom:10px;
  }
  .eyebrow .muted{color:var(--text-dimmer);font-weight:500;text-transform:none;letter-spacing:0;}

  .day-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px;}
  .day-check-badge{
    width:26px;height:26px;border-radius:50%;
    background:var(--success);color:#0c1a08;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  hr.div{border:none;border-top:1px solid var(--border-soft);margin:20px 0;}

  .home-title{font-size:1.55rem;color:var(--text);}

  .c-section{margin-top:26px;}
  .c-heading{
    font-size:.76rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
    color:var(--accent-text);
    margin-bottom:9px;
  }
  .c-body{color:var(--text);font-size:.98rem;line-height:1.75;}

  .further-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .further-list li{
    display:flex;align-items:flex-start;gap:10px;
    padding:11px 14px;
    background:var(--bg-raised-2);
    border:1px solid var(--border-soft);
    border-radius:10px;
    font-size:.88rem;
    color:var(--text-dim);
  }
  .further-list .li-icon{color:var(--text-dimmer);flex-shrink:0;margin-top:2px;}

  details.stretch{
    background:var(--bg-raised-2);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:2px 14px;
  }
  details.stretch summary{
    cursor:pointer;
    padding:12px 0;
    font-weight:700;
    color:var(--accent-text);
    font-size:.88rem;
    list-style:none;
    display:flex;align-items:center;gap:8px;
  }
  details.stretch summary::-webkit-details-marker{display:none;}
  details.stretch .caret{transition:transform .15s ease;}
  details.stretch[open] .caret{transform:rotate(90deg);}
  details.stretch p{padding-bottom:14px;color:var(--text-dim);margin:0;font-size:.88rem;line-height:1.6;}
  .stretch-hint{font-size:.76rem;color:var(--text-dimmer);margin:-4px 0 10px;}

  .teaser-box{
    background:linear-gradient(135deg, var(--bg-raised-2), var(--bg-raised));
    border:1px dashed var(--border);
    border-radius:10px;
    padding:14px 16px;
    font-size:.88rem;
    color:var(--text-dim);
    font-style:italic;
  }
  .teaser-locked{
    display:flex;align-items:center;gap:10px;
    color:var(--text-dimmer);
    font-size:.85rem;
    padding:4px 0;
  }

  /* ============ REFLECTION FORM ============ */
  .prompt-box{
    background:var(--bg-raised-2);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:14px 16px;
    font-size:.86rem;
    color:var(--text-dim);
    margin-bottom:12px;
    line-height:1.6;
  }
  textarea{
    width:100%;min-height:140px;
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:10px;
    color:var(--text);
    font-family:inherit;font-size:.95rem;
    padding:14px;resize:vertical;line-height:1.6;
  }
  textarea::placeholder{color:var(--text-dimmer);}
  .submit-btn{
    margin-top:14px;width:100%;
    background:var(--accent);color:var(--ink);
    border:none;padding:15px;border-radius:10px;
    font-weight:700;font-size:.95rem;
    cursor:pointer;
    min-height:48px;
    transition:transform .1s ease, background .15s ease;
  }
  .submit-btn:hover{background:var(--accent-2);}
  .submit-btn:active{transform:scale(.985);}
  .submit-btn.secondary{
    background:var(--bg-raised-2);
    color:var(--text-dim);
    border:1px solid var(--border-soft);
  }

  .done-banner{
    display:flex;align-items:center;gap:10px;
    background:color-mix(in srgb, var(--success) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--success) 30%, transparent);
    color:var(--success);
    padding:13px 16px;border-radius:10px;
    font-weight:600;font-size:.9rem;
  }
  .done-banner .ic{flex-shrink:0;}

  /* ============ PAGE HEADERS ============ */
  .page-title{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600;color:var(--text);margin-bottom:4px;}
  .page-sub{font-size:.9rem;color:var(--text-dim);margin-bottom:24px;}

  /* ============ PROGRESS ============ */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
  .stat-card{
    background:var(--bg-raised);border:1px solid var(--border-soft);
    border-radius:13px;padding:18px 14px;text-align:center;
  }
  .stat-num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;color:var(--accent-text);line-height:1;margin-bottom:6px;}
  .stat-label{font-size:.68rem;font-weight:700;color:var(--text-dimmer);letter-spacing:.06em;text-transform:uppercase;}

  .prog-bar-wrap{height:8px;background:var(--bg-raised-2);border-radius:6px;overflow:hidden;margin-bottom:28px;}
  .prog-bar-fill{height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));border-radius:6px;transition:width .5s ease;}

  .district-group{margin-bottom:24px;}
  .district-group-title{
    font-size:.8rem;color:var(--text-dim);font-weight:700;
    margin-bottom:11px;display:flex;align-items:center;gap:8px;
  }
  .district-group-title .badge{
    font-size:.64rem;background:var(--accent);color:var(--ink);
    padding:2px 8px;border-radius:10px;font-weight:800;text-transform:uppercase;
  }
  .circle-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:8px;}
  .dcircle{
    aspect-ratio:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.72rem;font-weight:700;
    cursor:pointer;position:relative;
    background:transparent;
    border:2px solid var(--border);
    color:var(--text-dimmer);
    transition:transform .12s ease;
  }
  .dcircle:hover:not(.dcircle-locked){transform:scale(1.1);}
  .dcircle-done{background:var(--accent);border-color:var(--accent);color:var(--ink);}
  .dcircle-today{border-color:var(--accent-2);border-width:2.5px;color:var(--accent-2);background:var(--bg-raised);}
  .dcircle-locked{cursor:default;opacity:.55;}
  .dcircle-locked:hover{transform:none;}

  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px;padding-top:6px;}
  .leg-item{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);}
  .leg-swatch{
    width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .leg-swatch.done{background:var(--accent);color:var(--ink);}
  .leg-swatch.today{border:2.5px solid var(--accent-2);color:var(--accent-2);}
  .leg-swatch.locked{border:2px solid var(--border);color:var(--text-dimmer);}

  /* ============ REFLECTIONS PAGE ============ */
  .ref-list{display:flex;flex-direction:column;gap:11px;}
  .ref-card{
    background:var(--bg-raised);border:1px solid var(--border-soft);
    border-radius:13px;overflow:hidden;
  }
  .ref-header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 18px;cursor:pointer;
    transition:background .15s ease;
  }
  .ref-header:hover{background:var(--bg-raised-2);}
  .ref-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
  .ref-day{font-size:.7rem;font-weight:800;color:var(--accent-text);letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;}
  .ref-name{font-size:.88rem;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ref-toggle{font-size:.78rem;color:var(--accent-text);font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:4px;}
  .ref-toggle .caret{transition:transform .15s ease;}
  .ref-card.open .ref-toggle .caret{transform:rotate(90deg);}
  .ref-body{display:none;padding:0 18px 18px;}
  .ref-card.open .ref-body{display:block;}

  .cream-card{
    background:var(--cream-bg);color:var(--cream-text);
    border-radius:9px;padding:20px 20px 26px;
    font-family:Georgia,'Palatino Linotype','Book Antiqua',serif;
    font-size:.92rem;line-height:1.75;
  }
  .cream-card p{margin:0 0 10px;}
  .cream-card p:last-child{margin-bottom:0;}
  .cream-empty{
    font-family:'Inter',sans-serif;font-style:italic;
    color:#8a7a5f;font-size:.85rem;
  }
  .ref-view-link{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:12px;font-size:.82rem;font-weight:600;
    color:var(--accent-text);cursor:pointer;
  }
  .ref-view-link:hover{color:var(--accent-2);}

  /* ============ LIST-CARD PATTERN (Community/Resources/Recordings) ============ */
  .list-card{
    background:var(--bg-raised);border:1px solid var(--border-soft);
    border-radius:13px;padding:6px 18px;
  }
  .list-row{
    display:flex;gap:13px;align-items:flex-start;
    padding:16px 0;border-bottom:1px solid var(--border-soft);
  }
  .list-row:last-child{border-bottom:none;}
  .list-icon{
    width:34px;height:34px;border-radius:8px;flex-shrink:0;
    background:var(--bg-raised-2);border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent-text);
  }
  .list-row .meta{font-size:.72rem;color:var(--text-dimmer);margin-bottom:3px;font-weight:600;}
  .list-row p{margin:0;font-size:.9rem;color:var(--text-dim);line-height:1.6;}
  .res-badge{
    font-size:.62rem;font-weight:700;color:var(--text-dimmer);
    background:var(--bg-raised-2);padding:3px 8px;border-radius:5px;
    letter-spacing:.03em;text-transform:uppercase;flex-shrink:0;align-self:center;
  }

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dimmer);font-size:.9rem;}

  /* ============ CELEBRATION ============ */
  #confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden;}
  .confetti-piece{position:absolute;top:-10px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:0.3; } }
  .celebrate-toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:var(--ink);
    padding:14px 22px;border-radius:30px;font-weight:700;font-size:.9rem;
    box-shadow:0 8px 24px #00000066;z-index:401;
    opacity:0;pointer-events:none;
    transition:all .3s ease;
  }
  .celebrate-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ BOTTOM NAV (mobile) ============ */
  #bottomnav{
    display:none;
    position:fixed;bottom:0;left:0;right:0;
    height:var(--bottom-h);
    background:var(--bg-sidebar);
    border-top:1px solid var(--border-soft);
    justify-content:space-around;align-items:center;
    z-index:260;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bn-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--text-dimmer);
    cursor:pointer;padding:6px 8px;min-width:56px;
    transition:color .15s ease;
  }
  .bn-item.active{color:var(--accent-text);}
  .bn-icon{width:21px;height:21px;}
  .bn-label{font-size:.62rem;font-weight:600;}

  /* ============ RESPONSIVE ============ */
  @media (max-width:900px){
    :root{--sidebar-w:230px;}
  }
  @media (max-width:768px){
    #hamburger{display:flex;}
    #sidebar{transform:translateX(-100%);}
    #sidebar.open{transform:translateX(0);}
    #main{margin-left:0;padding:20px 16px calc(var(--bottom-h) + 28px);max-width:760px;}
    #bottomnav{display:flex;}
    .stat-grid{gap:10px;}
    .circle-grid{gap:7px;}
  }
  @media (max-width:420px){
    .stat-num{font-size:1.5rem;}
  }
</style>
</head>
<body>

<header id="navbar">
  <div class="nb-left">
    <button id="hamburger" aria-label="Toggle menu"></button>
    <div class="nb-brand">
      <span class="mark">S</span>
      <span class="brand-text">Silent to Confident</span>
    </div>
  </div>
  <div class="nb-right">
    <span class="status-chip" id="statusChip"></span>
    <button class="icon-btn" id="themeBtn" title="Toggle light/dark theme" aria-label="Toggle light/dark theme"></button>
  </div>
</header>

<nav id="sidebar" aria-label="Main navigation">
  <div class="sb-top">
    <div class="sb-title">Silent to Confident</div>
    <div class="sb-sub" id="sidebarTagline"></div>
  </div>
  <div class="sb-nav" id="sidebarNav"></div>
  <div class="sb-progress">
    <div class="sb-progress-label">
      <span id="sbProgressText">Day 1 of 66</span>
      <span class="pct" id="sbProgressPct">0%</span>
    </div>
    <div class="sb-progress-bar"><div class="sb-progress-fill" id="sbProgressFill" style="width:0%"></div></div>
  </div>
</nav>

<div id="overlay"></div>

<main id="main">
  <div id="dayNavWrap"></div>
  <div id="view" class="content-col"></div>
</main>

<nav id="bottomnav" aria-label="Bottom navigation"></nav>

<div id="confetti-layer"></div>
<div class="celebrate-toast" id="toast">✨ Reflection saved — Day unlocked</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "s2c_progress_v1";
  const THEME_KEY = "s2c_theme_v1";

  const DISTRICTS = [
    {n:1, range:[1,7], name:"Why I'm Silent"},
    {n:2, range:[8,14], name:"The Language of Speaking Up"},
    {n:3, range:[15,21], name:"Entering the Room"},
    {n:4, range:[22,28], name:"Holding Your Ground"},
    {n:5, range:[29,35], name:"Making Them Want to Listen"},
    {n:6, range:[36,42], name:"Reading the Room in Real Time"},
    {n:7, range:[43,49], name:"The Voice People Know"},
    {n:8, range:[50,66], name:"Challenge Week"}
  ];

  /* ---------- Icons (feather-style inline SVG paths) ---------- */
  const ICON_PATHS = {
    home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    progress: '<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="0.5"/><rect x="12" y="8" width="3" height="10" rx="0.5"/><rect x="17" y="5" width="3" height="13" rx="0.5"/>',
    reflections: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
    community: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    resources: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    recordings: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',
    more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
    menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
    close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
    chevronRight: '<polyline points="9 18 15 12 9 6"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    mic: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>'
  };
  function icon(name, size){
    size = size || 18;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ""}</svg>`;
  }

  const NAV_ITEMS = [
    {id:"home", label:"Home", icon:"home"},
    {id:"progress", label:"Progress", icon:"progress"},
    {id:"reflections", label:"Reflections", icon:"reflections", badge:() => reflectionCount()},
    {id:"community", label:"Community", icon:"community"},
    {id:"resources", label:"Resources", icon:"resources", badge:() => resourcesCount()},
    {id:"recordings", label:"Recordings", icon:"recordings"}
  ];
  const BOTTOM_NAV_ITEMS = ["home","progress","reflections","resources"];

  let DATA = null;
  let state = { activeTab: "home", viewingDay: null, sidebarOpen: false };

  /* ---------- Progress persistence ---------- */
  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { completedDays: [], reflections: {} };
  }
  function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
  let progress = loadProgress();

  function isDayUnlocked(dayNum){
    if(dayNum === 1) return true;
    return progress.completedDays.includes(dayNum - 1);
  }
  function isDayComplete(dayNum){ return progress.completedDays.includes(dayNum); }
  function currentDay(){
    for(let i = 1; i <= DATA.totalDays; i++){
      if(!isDayComplete(i)) return i;
    }
    return DATA.totalDays;
  }
  function districtFor(dayNum){ return DISTRICTS.find(d => dayNum >= d.range[0] && dayNum <= d.range[1]); }
  function markComplete(dayNum, reflectionText){
    if(!progress.completedDays.includes(dayNum)) progress.completedDays.push(dayNum);
    if(reflectionText !== undefined) progress.reflections[dayNum] = reflectionText;
    saveProgress(progress);
  }
  function reflectionCount(){
    return progress.completedDays.filter(d => (progress.reflections[d] || "").trim().length > 0).length;
  }
  function resourcesCount(){
    let total = 0;
    DATA.days.forEach(d => {
      if(d.further) total += d.further.filter(f => !/^\[Tool\] None/i.test(f)).length;
    });
    return total;
  }

  /* ---------- Theme ---------- */
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("themeBtn");
    btn.innerHTML = icon(theme === "light" ? "moon" : "sun", 17);
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "light" ? "dark" : "light";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }

  /* ---------- Sidebar / mobile drawer ---------- */
  function openSidebar(){
    state.sidebarOpen = true;
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("show");
  }
  function closeSidebar(){
    state.sidebarOpen = false;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }

  /* ---------- Fetch data ---------- */
  fetch("data.json")
    .then(r => r.json())
    .then(json => { DATA = json; init(); })
    .catch(err => {
      document.getElementById("view").innerHTML =
        "<div class='card'><p>Could not load data.json — make sure it's in the same directory as index.html.</p></div>";
      console.error(err);
    });

  function init(){
    document.getElementById("sidebarTagline").textContent = DATA.tagline;

    let theme = "dark";
    try{ const saved = localStorage.getItem(THEME_KEY); if(saved) theme = saved; }catch(e){}
    applyTheme(theme);

    document.getElementById("hamburger").innerHTML = icon("menu", 20);
    document.getElementById("hamburger").addEventListener("click", openSidebar);
    document.getElementById("overlay").addEventListener("click", closeSidebar);
    document.getElementById("themeBtn").addEventListener("click", toggleTheme);
    document.addEventListener("keydown", onKeyDown);

    render();
  }

  function onKeyDown(e){
    if(e.key === "Escape" && state.sidebarOpen){ closeSidebar(); return; }
    const tag = e.target.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(state.activeTab !== "home") return;
    const day = state.viewingDay || currentDay();
    if(e.key === "ArrowLeft" && day > 1){
      e.preventDefault();
      const target = day - 1;
      state.viewingDay = target === currentDay() ? null : target;
      render();
    }else if(e.key === "ArrowRight" && day < currentDay()){
      e.preventDefault();
      const target = day + 1;
      state.viewingDay = target === currentDay() ? null : target;
      render();
    }
  }

  function goToTab(tabId){
    state.activeTab = tabId;
    state.viewingDay = null;
    closeSidebar();
    render();
  }

  /* ---------- Nav rendering ---------- */
  function renderSidebarNav(){
    const el = document.getElementById("sidebarNav");
    el.innerHTML = "";
    NAV_ITEMS.forEach(item => {
      const div = document.createElement("div");
      div.className = "nav-item" + (state.activeTab === item.id ? " active" : "");
      const badgeVal = item.badge ? item.badge() : null;
      div.innerHTML = `<span class="nav-icon">${icon(item.icon, 18)}</span><span class="nav-label">${item.label}</span>${badgeVal ? `<span class="nav-badge">${badgeVal}</span>` : ""}`;
      div.onclick = () => goToTab(item.id);
      el.appendChild(div);
    });
  }
  function renderBottomNav(){
    const el = document.getElementById("bottomnav");
    el.innerHTML = "";
    BOTTOM_NAV_ITEMS.forEach(id => {
      const item = NAV_ITEMS.find(n => n.id === id);
      const btn = document.createElement("button");
      btn.className = "bn-item" + (state.activeTab === id ? " active" : "");
      btn.innerHTML = `<span class="bn-icon">${icon(item.icon, 21)}</span><span class="bn-label">${item.label}</span>`;
      btn.onclick = () => goToTab(id);
      el.appendChild(btn);
    });
    const more = document.createElement("button");
    more.className = "bn-item" + (state.sidebarOpen ? " active" : "");
    more.innerHTML = `<span class="bn-icon">${icon("more", 21)}</span><span class="bn-label">More</span>`;
    more.onclick = () => openSidebar();
    el.appendChild(more);
  }
  function renderStatusChip(){
    const chip = document.getElementById("statusChip");
    const pct = Math.round((progress.completedDays.length / DATA.totalDays) * 100);
    chip.textContent = `${progress.completedDays.length} / ${DATA.totalDays} days · ${pct}%`;
  }
  function renderSidebarProgress(){
    const day = currentDay();
    const pct = Math.round((progress.completedDays.length / DATA.totalDays) * 100);
    document.getElementById("sbProgressText").textContent = `Day ${day} of ${DATA.totalDays}`;
    document.getElementById("sbProgressPct").textContent = `${pct}%`;
    document.getElementById("sbProgressFill").style.width = `${pct}%`;
  }

  function render(){
    renderSidebarNav();
    renderBottomNav();
    renderStatusChip();
    renderSidebarProgress();

    const dayNavWrap = document.getElementById("dayNavWrap");
    dayNavWrap.innerHTML = "";
    if(state.activeTab === "home"){
      dayNavWrap.appendChild(renderDayPills());
    }

    const view = document.getElementById("view");
    view.innerHTML = "";
    switch(state.activeTab){
      case "home": view.appendChild(renderHome()); break;
      case "progress": view.appendChild(renderProgress()); break;
      case "reflections": view.appendChild(renderReflections()); break;
      case "community": view.appendChild(renderCommunity()); break;
      case "resources": view.appendChild(renderResources()); break;
      case "recordings": view.appendChild(renderRecordings()); break;
    }
    window.scrollTo({top:0, behavior:"instant"});
  }

  /* ---------- DAY PILL NAV ---------- */
  const PILL_COUNT = 5;
  let pillStart = 1;

  function renderDayPills(){
    const activeDay = state.viewingDay || currentDay();
    const today = currentDay();
    const half = Math.floor(PILL_COUNT / 2);
    pillStart = Math.max(1, Math.min(activeDay - half, DATA.totalDays - PILL_COUNT + 1));
    if(DATA.totalDays < PILL_COUNT) pillStart = 1;

    const wrap = document.createElement("div");
    wrap.className = "day-nav";

    const prevArrow = document.createElement("button");
    prevArrow.className = "day-arrow";
    prevArrow.innerHTML = icon("chevronLeft", 15);
    prevArrow.setAttribute("aria-label", "Show earlier days");
    prevArrow.disabled = pillStart <= 1;
    prevArrow.onclick = () => { pillStart = Math.max(1, pillStart - PILL_COUNT); renderPillsInto(wrap, activeDay, today); };
    wrap.appendChild(prevArrow);

    const pillHolder = document.createElement("div");
    pillHolder.style.display = "contents";
    wrap.appendChild(pillHolder);

    const nextArrow = document.createElement("button");
    nextArrow.className = "day-arrow";
    nextArrow.innerHTML = icon("chevronRight", 15);
    nextArrow.setAttribute("aria-label", "Show later days");
    wrap.appendChild(nextArrow);

    function renderPillsInto(){
      wrap.querySelectorAll(".pill").forEach(p => p.remove());
      const maxStart = Math.max(1, DATA.totalDays - PILL_COUNT + 1);
      prevArrow.disabled = pillStart <= 1;
      nextArrow.disabled = pillStart >= maxStart;
      for(let i = 0; i < PILL_COUNT; i++){
        const d = pillStart + i;
        if(d > DATA.totalDays) break;
        const unlocked = isDayUnlocked(d);
        const done = isDayComplete(d);
        const isActive = d === activeDay;
        const isToday = d === today && !done;

        const pill = document.createElement("button");
        let cls = "pill";
        if(isActive) cls += " pill-current";
        else if(done) cls += " pill-done";
        else if(isToday) cls += " pill-today";
        if(!unlocked) cls += " pill-locked";
        pill.className = cls;
        pill.innerHTML = unlocked
          ? `<span class="pill-label">${isToday ? "Today" : "Day"}</span><span class="pill-num">${d}</span>`
          : `<span class="pill-label">${icon("lock", 10)}</span><span class="pill-num">${d}</span>`;
        if(unlocked){
          pill.onclick = () => { state.viewingDay = d === currentDay() ? null : d; render(); };
        }
        nextArrow.insertAdjacentElement("beforebegin", pill);
      }
    }
    nextArrow.onclick = () => {
      const maxStart = Math.max(1, DATA.totalDays - PILL_COUNT + 1);
      pillStart = Math.min(maxStart, pillStart + PILL_COUNT);
      renderPillsInto();
    };
    renderPillsInto();
    return wrap;
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    const wrap = document.createElement("div");
    const dayNum = state.viewingDay || currentDay();
    const day = DATA.days.find(d => d.day === dayNum);
    const dist = districtFor(dayNum);

    if(!day){
      wrap.innerHTML = "<div class='card'><p>You've completed all 66 days. 🎉</p></div>";
      return wrap;
    }

    if(dayNum >= 53 && dist.n === 8){
      const banner = document.createElement("div");
      banner.className = "card soft";
      banner.style.display = "flex";
      banner.style.alignItems = "center";
      banner.style.gap = "10px";
      banner.style.color = "var(--accent-text)";
      banner.style.fontWeight = "700";
      banner.innerHTML = `<span>🔥</span><span>Challenge Week — Day ${dayNum} of 66. This is the final stretch.</span>`;
      wrap.appendChild(banner);
    }

    const card = document.createElement("div");
    card.className = day.type === "sunday" ? "card soft" : "card";

    const headerRow = document.createElement("div");
    headerRow.className = "day-header-row";
    const eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.innerHTML = `<span>Day ${day.day} of ${DATA.totalDays}</span><span class="muted">· District ${dist.n} — ${dist.name}</span>`;
    headerRow.appendChild(eyebrow);
    if(isDayComplete(day.day)){
      const badge = document.createElement("div");
      badge.className = "day-check-badge";
      badge.innerHTML = icon("check", 14);
      headerRow.appendChild(badge);
    }
    card.appendChild(headerRow);

    const h = document.createElement("h2");
    h.className = "home-title";
    h.textContent = day.title;
    card.appendChild(h);

    card.appendChild(document.createElement("hr")).className = "div";

    if(day.type === "learning" || day.type === "buffer"){
      card.appendChild(renderLearningBody(day));
    } else if(day.type === "sunday"){
      card.appendChild(renderSundayBody(day));
    } else if(day.type === "light"){
      card.appendChild(renderLightBody(day));
    }

    wrap.appendChild(card);

    if(state.viewingDay && state.viewingDay !== currentDay()){
      const backBtn = document.createElement("button");
      backBtn.className = "submit-btn secondary";
      backBtn.textContent = "← Back to today";
      backBtn.onclick = () => { state.viewingDay = null; render(); };
      wrap.appendChild(backBtn);
    }

    return wrap;
  }

  function makeBlock(label, text){
    const s = document.createElement("section");
    s.className = "c-section";
    s.innerHTML = `<h3 class="c-heading">${label}</h3><div class="c-body"></div>`;
    s.querySelector(".c-body").textContent = text;
    return s;
  }

  function renderLearningBody(day){
    const frag = document.createDocumentFragment();
    frag.appendChild(makeBlock("The Idea", day.idea));
    frag.appendChild(makeBlock("Why It Matters", day.why));
    frag.appendChild(makeBlock("Today's Build", day.task));
    frag.appendChild(renderReflectionBlock(day));

    if(day.further && day.further.length){
      const s = document.createElement("section");
      s.className = "c-section";
      s.innerHTML = `<h3 class="c-heading">Further Reading</h3>`;
      const ul = document.createElement("ul");
      ul.className = "further-list";
      day.further.forEach(f => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="li-icon">${icon("link", 13)}</span><span></span>`;
        li.querySelector("span:last-child").textContent = f;
        ul.appendChild(li);
      });
      s.appendChild(ul);
      frag.appendChild(s);
    }

    if(day.stretch){
      const s = document.createElement("section");
      s.className = "c-section";
      s.innerHTML = `<h3 class="c-heading">Stretch (optional)</h3><div class="stretch-hint">Come back to this whenever it feels right — it's not required.</div>`;
      const det = document.createElement("details");
      det.className = "stretch";
      det.innerHTML = `<summary><span class="caret">${icon("chevronRight", 13)}</span><span>Push a little further</span></summary><p></p>`;
      det.querySelector("p").textContent = day.stretch;
      s.appendChild(det);
      frag.appendChild(s);
    }

    if(day.teaser){
      frag.appendChild(renderTeaserBlock(day));
    }

    return frag;
  }

  function renderSundayBody(day){
    const frag = document.createDocumentFragment();

    const s1 = document.createElement("section");
    s1.className = "c-section";
    s1.innerHTML = `<h3 class="c-heading">This Week's Recap</h3>`;
    const ol = document.createElement("ol");
    ol.style.paddingLeft = "20px";
    ol.style.color = "var(--text)";
    ol.style.margin = "0";
    (day.recap || []).forEach(q => {
      const li = document.createElement("li");
      li.style.marginBottom = "10px";
      li.style.lineHeight = "1.6";
      li.textContent = q;
      ol.appendChild(li);
    });
    s1.appendChild(ol);
    frag.appendChild(s1);

    if(day.community){
      frag.appendChild(makeBlock("Share With the Community", day.community));
    }
    if(day.rest){
      const s = document.createElement("section");
      s.className = "c-section";
      const box = document.createElement("div");
      box.className = "card soft";
      box.style.margin = "0";
      box.style.padding = "18px";
      box.textContent = day.rest;
      s.appendChild(box);
      frag.appendChild(s);
    }

    frag.appendChild(renderSundayUnlockBlock(day));
    return frag;
  }

  function renderLightBody(day){
    const frag = document.createDocumentFragment();
    frag.appendChild(makeBlock("Today", day.body));
    if(day.community){
      frag.appendChild(makeBlock("Community", day.community));
    }
    frag.appendChild(renderLightReflectionBlock(day));
    if(day.teaser){
      frag.appendChild(renderTeaserBlock(day));
    }
    return frag;
  }

  /* ---------- Reflection widgets ---------- */
  function renderReflectionBlock(day){
    const s = document.createElement("section");
    s.className = "c-section";
    s.innerHTML = `<h3 class="c-heading">Reflection</h3>`;

    const complete = isDayComplete(day.day);
    if(complete){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      banner.innerHTML = `<span class="ic">${icon("check", 16)}</span><span>Reflection submitted. Day ${day.day + 1} is unlocked.</span>`;
      s.appendChild(banner);
      return s;
    }

    const promptBox = document.createElement("div");
    promptBox.className = "prompt-box";
    promptBox.textContent = day.reflection;
    s.appendChild(promptBox);

    const ta = document.createElement("textarea");
    ta.placeholder = "Write your reflection here (optional)...";
    ta.setAttribute("aria-label", "Reflection for day " + day.day);
    ta.value = progress.reflections[day.day] || "";
    s.appendChild(ta);

    const btn = document.createElement("button");
    btn.className = "submit-btn";
    btn.textContent = "Submit Reflection";
    s.appendChild(btn);

    btn.onclick = () => {
      markComplete(day.day, ta.value);
      celebrate();
      render();
    };

    return s;
  }

  function renderLightReflectionBlock(day){
    const s = document.createElement("section");
    s.className = "c-section";
    s.innerHTML = `<h3 class="c-heading">Reflection</h3>`;

    const complete = isDayComplete(day.day);
    if(complete){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      const nextTxt = day.day < DATA.totalDays ? `Day ${day.day + 1} is unlocked.` : "You've completed the cohort.";
      banner.innerHTML = `<span class="ic">${icon("check", 16)}</span><span>Acknowledged. ${nextTxt}</span>`;
      s.appendChild(banner);
      return s;
    }

    const promptBox = document.createElement("div");
    promptBox.className = "prompt-box";
    promptBox.textContent = day.reflection;
    s.appendChild(promptBox);

    const ta = document.createElement("textarea");
    ta.placeholder = "Write your reflection here (optional)...";
    ta.setAttribute("aria-label", "Reflection for day " + day.day);
    ta.style.minHeight = "100px";
    ta.value = progress.reflections[day.day] || "";
    s.appendChild(ta);

    const btn = document.createElement("button");
    btn.className = "submit-btn";
    btn.textContent = "Continue";
    s.appendChild(btn);

    btn.onclick = () => {
      markComplete(day.day, ta.value);
      celebrate();
      render();
    };

    return s;
  }

  function renderSundayUnlockBlock(day){
    const s = document.createElement("section");
    s.className = "c-section";
    const complete = isDayComplete(day.day);

    if(complete){
      const banner = document.createElement("div");
      banner.className = "done-banner";
      const nextTxt = day.day < DATA.totalDays ? `Day ${day.day + 1} is unlocked.` : "You've completed the cohort.";
      banner.innerHTML = `<span class="ic">${icon("check", 16)}</span><span>${nextTxt}</span>`;
      s.appendChild(banner);
      return s;
    }

    const btn = document.createElement("button");
    btn.className = "submit-btn";
    btn.textContent = "I've reflected — Unlock next district";
    s.appendChild(btn);
    btn.onclick = () => {
      markComplete(day.day);
      celebrate();
      render();
    };
    return s;
  }

  function renderTeaserBlock(day){
    const s = document.createElement("section");
    s.className = "c-section";
    s.innerHTML = `<h3 class="c-heading">Tomorrow</h3>`;
    const complete = isDayComplete(day.day);
    if(complete){
      const box = document.createElement("div");
      box.className = "teaser-box";
      box.textContent = day.teaser;
      s.appendChild(box);
    }else{
      const locked = document.createElement("div");
      locked.className = "teaser-locked";
      locked.innerHTML = `<span>${icon("lock", 14)}</span><span>Submit today's reflection to reveal tomorrow's teaser.</span>`;
      s.appendChild(locked);
    }
    return s;
  }

  /* ---------- Celebration micro-animation ---------- */
  function celebrate(){
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);

    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;

    const layer = document.getElementById("confetti-layer");
    const colors = ["#F2793B", "#F7B267", "#F2EDE4"];
    for(let i = 0; i < 26; i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      const size = 6 + Math.random() * 6;
      p.style.width = size + "px";
      p.style.height = (size * 0.4) + "px";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (1.6 + Math.random() * 1.2) + "s";
      p.style.animationDelay = (Math.random() * 0.3) + "s";
      layer.appendChild(p);
      setTimeout(() => p.remove(), 3200);
    }
  }

  /* ---------- PROGRESS ---------- */
  function renderProgress(){
    const wrap = document.createElement("div");

    const completedCount = progress.completedDays.length;
    const pct = Math.round((completedCount / DATA.totalDays) * 100);
    const today = currentDay();

    const titleDiv = document.createElement("div");
    titleDiv.className = "page-title";
    titleDiv.textContent = "Progress";
    wrap.appendChild(titleDiv);
    const subDiv = document.createElement("div");
    subDiv.className = "page-sub";
    subDiv.textContent = "Your evidence trail across all 66 days.";
    wrap.appendChild(subDiv);

    const statGrid = document.createElement("div");
    statGrid.className = "stat-grid";
    statGrid.innerHTML = `
      <div class="stat-card"><div class="stat-num">${completedCount}</div><div class="stat-label">Days Completed</div></div>
      <div class="stat-card"><div class="stat-num">${Math.min(today, DATA.totalDays)}</div><div class="stat-label">Current Day</div></div>
      <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">Complete</div></div>
    `;
    wrap.appendChild(statGrid);

    const barWrap = document.createElement("div");
    barWrap.className = "prog-bar-wrap";
    barWrap.innerHTML = `<div class="prog-bar-fill" style="width:${pct}%"></div>`;
    wrap.appendChild(barWrap);

    DISTRICTS.forEach(dist => {
      const group = document.createElement("div");
      group.className = "district-group";

      const title = document.createElement("div");
      title.className = "district-group-title";
      title.innerHTML = `<span class="badge">D${dist.n}</span><span>${dist.name}</span>`;
      group.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "circle-grid";

      for(let d = dist.range[0]; d <= dist.range[1]; d++){
        const cell = document.createElement("div");
        const done = isDayComplete(d);
        const unlocked = isDayUnlocked(d);
        const isToday = d === today && !done;

        let cls = "dcircle";
        if(done) cls += " dcircle-done";
        else if(isToday) cls += " dcircle-today";
        if(!unlocked) cls += " dcircle-locked";
        cell.className = cls;

        if(!unlocked){
          cell.innerHTML = icon("lock", 12);
        }else if(done){
          cell.innerHTML = icon("check", 13);
        }else{
          cell.textContent = d;
        }
        cell.title = `Day ${d}${unlocked ? "" : " (locked)"}`;

        if(unlocked){
          cell.onclick = () => { state.viewingDay = d === currentDay() ? null : d; state.activeTab = "home"; render(); };
        }
        grid.appendChild(cell);
      }
      group.appendChild(grid);
      wrap.appendChild(group);
    });

    const legend = document.createElement("div");
    legend.className = "legend";
    legend.innerHTML = `
      <div class="leg-item"><span class="leg-swatch done">${icon("check", 10)}</span>Completed</div>
      <div class="leg-item"><span class="leg-swatch today"></span>Today</div>
      <div class="leg-item"><span class="leg-swatch locked">${icon("lock", 9)}</span>Locked</div>
    `;
    wrap.appendChild(legend);

    return wrap;
  }

  /* ---------- REFLECTIONS ---------- */
  function buildReflectionHTML(text){
    if(!text || !text.trim()) return '<p class="cream-empty">No reflection written for this day.</p>';
    const paras = text.trim().split(/\n\n+/);
    return paras.map(p => {
      const div = document.createElement("div");
      div.textContent = p;
      return `<p>${div.innerHTML.replace(/\n/g, "<br>")}</p>`;
    }).join("");
  }

  function renderReflections(){
    const wrap = document.createElement("div");
    const titleDiv = document.createElement("div");
    titleDiv.className = "page-title";
    titleDiv.textContent = "Reflections";
    wrap.appendChild(titleDiv);
    const subDiv = document.createElement("div");
    subDiv.className = "page-sub";
    subDiv.textContent = "Everything you've written so far, in one place.";
    wrap.appendChild(subDiv);

    const completed = [...progress.completedDays].sort((a,b) => b - a);
    if(!completed.length){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Nothing here yet — reflections you submit will show up as you move through the days.";
      wrap.appendChild(empty);
      return wrap;
    }

    const list = document.createElement("div");
    list.className = "ref-list";

    completed.forEach((dayNum, idx) => {
      const day = DATA.days.find(d => d.day === dayNum);
      const dist = districtFor(dayNum);
      const text = progress.reflections[dayNum] || "";

      const card = document.createElement("div");
      card.className = "ref-card" + (idx === 0 ? " open" : "");

      const header = document.createElement("div");
      header.className = "ref-header";
      header.innerHTML = `
        <div class="ref-meta">
          <span class="ref-day">Day ${dayNum}</span>
          <span class="ref-name">${day ? day.title : ""}</span>
        </div>
        <span class="ref-toggle"><span class="caret">${icon("chevronRight", 13)}</span>${card.classList.contains("open") ? "Close" : "Open"}</span>
      `;
      header.onclick = () => {
        card.classList.toggle("open");
        header.querySelector(".ref-toggle").innerHTML = `<span class="caret">${icon("chevronRight", 13)}</span>${card.classList.contains("open") ? "Close" : "Open"}`;
      };
      card.appendChild(header);

      const body = document.createElement("div");
      body.className = "ref-body";
      const creamCard = document.createElement("div");
      creamCard.className = "cream-card";
      creamCard.innerHTML = `<div style="font-size:.72rem;color:#8a7a5f;font-family:'Inter',sans-serif;font-style:italic;margin-bottom:8px;">Day ${dayNum} · District ${dist.n} — ${dist.name}</div>` + buildReflectionHTML(text);
      body.appendChild(creamCard);

      const viewLink = document.createElement("span");
      viewLink.className = "ref-view-link";
      viewLink.innerHTML = `<span>View full day</span>${icon("chevronRight", 12)}`;
      viewLink.onclick = () => { state.viewingDay = dayNum === currentDay() ? null : dayNum; state.activeTab = "home"; render(); };
      body.appendChild(viewLink);

      card.appendChild(body);
      list.appendChild(card);
    });

    wrap.appendChild(list);
    return wrap;
  }

  /* ---------- COMMUNITY ---------- */
  function renderCommunity(){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="page-title">Community</div>
      <div class="page-sub">A space to share your reps with people doing the same work.</div>
      <div class="list-card">
        <div class="list-row">
          <div class="list-icon">${icon("community", 16)}</div>
          <div><div class="meta">Announcement</div><p>Welcome to Silent to Confident. Post your Day 6 "one sentence" moment below when you get there — the group loves hearing the small, real ones.</p></div>
        </div>
        <div class="list-row">
          <div class="list-icon">${icon("community", 16)}</div>
          <div><div class="meta">Announcement</div><p>Weekly community thread opens every Sunday alongside "Connecting the Dots." Drop your recap there.</p></div>
        </div>
        <div class="list-row">
          <div class="list-icon">${icon("community", 16)}</div>
          <div><div class="meta">Announcement</div><p>Challenge Week (Days 53–66) has its own dedicated thread — tag your posts with your Challenge moment for feedback.</p></div>
        </div>
      </div>
    `;
    return wrap;
  }

  /* ---------- RESOURCES ---------- */
  function renderResources(){
    const wrap = document.createElement("div");
    const titleDiv = document.createElement("div");
    titleDiv.className = "page-title";
    titleDiv.textContent = "Resources";
    wrap.appendChild(titleDiv);
    const subDiv = document.createElement("div");
    subDiv.className = "page-sub";
    subDiv.textContent = "Further reading and tools pulled from each day, organized by district.";
    wrap.appendChild(subDiv);

    DISTRICTS.forEach(dist => {
      const daysInDist = DATA.days.filter(d => d.day >= dist.range[0] && d.day <= dist.range[1] && d.further && d.further.length);
      if(!daysInDist.length) return;

      const groupTitle = document.createElement("div");
      groupTitle.className = "district-group-title";
      groupTitle.innerHTML = `<span class="badge">D${dist.n}</span><span>${dist.name}</span>`;
      wrap.appendChild(groupTitle);

      const card = document.createElement("div");
      card.className = "list-card";
      card.style.marginBottom = "22px";

      daysInDist.forEach(d => {
        d.further.forEach(f => {
          if(/^\[Tool\] None/i.test(f)) return;
          const row = document.createElement("div");
          row.className = "list-row";
          row.innerHTML = `<div class="list-icon">${icon("link", 14)}</div><div style="flex:1;"><div class="meta">Day ${d.day} — ${d.title}</div><p></p></div><span class="res-badge">Day ${d.day}</span>`;
          row.querySelector("p").textContent = f;
          card.appendChild(row);
        });
      });
      wrap.appendChild(card);
    });

    return wrap;
  }

  /* ---------- RECORDINGS ---------- */
  function renderRecordings(){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="page-title">Recordings</div>
      <div class="page-sub">Live session recordings will appear here after each cohort call.</div>
      <div class="list-card">
        <div class="list-row">
          <div class="list-icon">${icon("mic", 15)}</div>
          <div><div class="meta">District 1 Kickoff</div><p>Recording will be posted after the live session.</p></div>
        </div>
        <div class="list-row">
          <div class="list-icon">${icon("mic", 15)}</div>
          <div><div class="meta">Mid-Cohort Q&amp;A (Week 5)</div><p>Recording will be posted after the live session.</p></div>
        </div>
        <div class="list-row">
          <div class="list-icon">${icon("mic", 15)}</div>
          <div><div class="meta">Challenge Week Kickoff</div><p>Recording will be posted after the live session.</p></div>
        </div>
      </div>
    `;
    return wrap;
  }

})();
</script>
</body>
</html>
